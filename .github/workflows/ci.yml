name: CI

# Every push and pull request is tested on Windows, macOS and Linux, and
# packaged for Windows, macOS and (as a Flatpak bundle) Linux, kept as
# workflow artifacts. On a push to main whose Cargo.toml version has no tag
# yet, the publish job then tags yyyy.mm.dd.n and publishes a release with the
# three packages. Pushes that don't bump the version are tested only.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Models are downloaded (pinned + SHA-256 verified) by the tests on first use.
  HANSTAT_MODEL_DIR: ${{ github.workspace }}/.models

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.rel.outputs.tag }}
      release: ${{ steps.rel.outputs.release }}
    steps:
      - uses: actions/checkout@v7

      - name: Decide whether to release
        id: rel
        shell: pwsh
        run: |
          # Releases are yyyy.mm.dd.n (n = 0, 1, … for releases on the same day).
          # Cargo.toml can't hold leading zeros, so it has yyyy.Mdd.n
          # (2026.1115.0 -> 2026.11.15.0); src/update.rs decodes it the same way.
          $v = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ($v -notmatch '^(\d{4})\.(\d{3,4})\.(\d+)$') { throw "Cargo.toml version $v is not yyyy.Mdd.n" }
          $md = [int]$Matches[2]
          $tag = '{0}.{1:D2}.{2:D2}.{3}' -f $Matches[1], [int][math]::Floor($md / 100), ($md % 100), $Matches[3]
          "tag=$tag" >> $env:GITHUB_OUTPUT
          if ('${{ github.event_name }}' -ne 'push' -or '${{ github.ref }}' -ne 'refs/heads/main') {
            "release=false" >> $env:GITHUB_OUTPUT
          } elseif (git ls-remote --tags origin "refs/tags/$tag") {
            "Version $tag is already released; bump Cargo.toml to publish a new release."
            "release=false" >> $env:GITHUB_OUTPUT
          } else {
            "Releasing $tag."
            "release=true" >> $env:GITHUB_OUTPUT
          }

  windows:
    name: Windows
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Cache segmentation models
        uses: actions/cache@v6
        with:
          path: .models
          key: models-${{ runner.os }}-${{ hashFiles('src/models.rs') }}

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --release --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked --bins

      - name: Package
        shell: pwsh
        run: |
          # Fixed names, no version: .../releases/latest/download/<name>.zip is
          # a permanent link, and a manual update is "replace the hanstat
          # folder". The in-app updater looks for exactly this asset name.
          $name = "hanstat-x86_64-pc-windows-msvc"
          $dir = "hanstat"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item target/release/hanstat.exe, target/release/hanstat-cli.exe, README.md, CHANGELOG.md, LICENSE-MIT, LICENSE-APACHE $dir
          Copy-Item data/OpenCC-LICENSE.txt "$dir/LICENSE-OpenCC-data.txt"
          Copy-Item data/HSK-LICENSE.txt "$dir/LICENSE-HSK-data.txt"
          Copy-Item data/JLPT-LICENSE.txt "$dir/LICENSE-JLPT-data.txt"
          Compress-Archive -Path $dir -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: hanstat-x86_64-pc-windows-msvc
          path: hanstat-x86_64-pc-windows-msvc.zip*
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS
    needs: version
    runs-on: macos-latest # Apple Silicon
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Cache segmentation models
        uses: actions/cache@v6
        with:
          path: .models
          key: models-${{ runner.os }}-${{ hashFiles('src/models.rs') }}

      - name: Clippy
        run: cargo clippy --release --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked --bins

      # hanstat.app as hanstat-aarch64-apple-darwin.zip, the asset the
      # in-app updater looks for on macOS.
      - name: Package
        run: |
          sh macos/bundle.sh dist
          unzip -l dist/hanstat-aarch64-apple-darwin.zip

      - uses: actions/upload-artifact@v7
        with:
          name: hanstat-aarch64-apple-darwin
          path: dist/hanstat-aarch64-apple-darwin.zip*
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Cache segmentation models
        uses: actions/cache@v6
        with:
          path: .models
          key: models-${{ runner.os }}-${{ hashFiles('src/models.rs') }}

      - name: Clippy
        run: cargo clippy --release --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --release --locked

  # The Linux release: flatpak/io.github.caocaochan.hanstat.yml built in the
  # freedesktop SDK, as hanstat-x86_64-linux.flatpak (a fixed name, so
  # .../releases/latest/download/hanstat-x86_64-linux.flatpak is a permanent
  # link). The bundle names Flathub as the source of its runtime.
  flatpak:
    name: Flatpak
    needs: version
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      # The image's runtimes sit in a lower overlayfs layer, where flatpak
      # can't update them in place ("Invalid cross-device link", after which
      # flatpak-builder segfaults) once Flathub has a newer SDK than the
      # image. A copy lives in the writable layer; updating here also shows
      # any failure as its own step.
      - name: Make the preinstalled runtimes updatable
        run: |
          dir=$(flatpak --system --installations)
          cp -a "$dir" "$dir.copy"
          rm -rf "$dir"
          mv "$dir.copy" "$dir"
          flatpak update --system --noninteractive -y

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: flatpak/io.github.caocaochan.hanstat.yml
          bundle: hanstat-x86_64-linux.flatpak
          artifact-name: hanstat-x86_64-linux

  publish:
    name: Publish release
    needs: [version, windows, macos, linux, flatpak]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      # Creating the release (and its tag).
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $ver = "${{ needs.version.outputs.tag }}"
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^## \[$([regex]::Escape($ver))\]").LineNumber
          if (-not $start) { throw "No CHANGELOG.md section for $ver" }
          $rest = $lines[$start..($lines.Count - 1)]
          $end = ($rest | Select-String -Pattern '^## \[' | Select-Object -First 1).LineNumber
          $body = if ($end) { $rest[0..($end - 2)] } else { $rest }
          $body | Out-File -Encoding utf8 notes.md

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ needs.version.outputs.tag }}"
          # Creates the tag on the tested commit.
          gh release create $tag (Get-ChildItem dist -File).FullName `
            --target "${{ github.sha }}" --title "hanstat $tag" --notes-file notes.md
