name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Models are downloaded (pinned + SHA-256 verified) by the tests on first use.
  HANSTAT_MODEL_DIR: ${{ github.workspace }}/.models

jobs:
  test:
    name: Test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Cache segmentation models
        uses: actions/cache@v6
        with:
          path: .models
          key: models-${{ hashFiles('src/models.rs') }}

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --release --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --release --locked
