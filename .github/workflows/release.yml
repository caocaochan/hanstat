name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  HANSTAT_MODEL_DIR: ${{ github.workspace }}/.models

jobs:
  release:
    name: Build and publish (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Cache segmentation models
        uses: actions/cache@v6
        with:
          path: .models
          key: models-${{ hashFiles('src/models.rs') }}

      - name: Check tag matches Cargo.toml version
        shell: pwsh
        run: |
          $v = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Cargo.toml version v$v does not match tag ${{ github.ref_name }}" }

      - name: Test
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked --bins

      - name: Package
        id: package
        shell: pwsh
        run: |
          $name = "hanstat-${{ github.ref_name }}-x86_64-pc-windows-msvc"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/release/hanstat.exe, target/release/hanstat-cli.exe, README.md, CHANGELOG.md, LICENSE-MIT, LICENSE-APACHE $name
          Copy-Item data/OpenCC-LICENSE.txt "$name/LICENSE-OpenCC-data.txt"
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"
          "name=$name" >> $env:GITHUB_OUTPUT

      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^## \[$([regex]::Escape($ver))\]").LineNumber
          if (-not $start) { throw "No CHANGELOG.md section for $ver" }
          $rest = $lines[$start..($lines.Count - 1)]
          $end = ($rest | Select-String -Pattern '^## \[' | Select-Object -First 1).LineNumber
          $body = if ($end) { $rest[0..($end - 2)] } else { $rest }
          $body | Out-File -Encoding utf8 notes.md

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $name = "${{ steps.package.outputs.name }}"
          gh release create "${{ github.ref_name }}" "$name.zip" "$name.zip.sha256" `
            --verify-tag --title "hanstat ${{ github.ref_name }}" --notes-file notes.md
