[package]
name = "hanstat"
version = "2026.1124.6"
edition = "2024"
description = "Accurate character/word statistics for Chinese EPUB and TXT files"
license = "MIT OR Apache-2.0"
repository = "https://github.com/caocaochan/hanstat"
readme = "README.md"
keywords = ["chinese", "epub", "word-segmentation", "text-analysis", "hsk"]
default-run = "hanstat"

[[bin]]
name = "hanstat"
path = "src/main.rs"

[[bin]]
name = "hanstat-cli"
path = "src/bin/hanstat-cli.rs"

[dependencies]
aho-corasick = "1.1.5"
candle-core = "0.11.1"
candle-nn = "0.11.1"
candle-transformers = "0.11.1"
chardetng = "1.0.0"
# Reader read-aloud (src/reader/tts): sound output and MP3 decoding.
cpal = "0.18.2"
eframe = { version = "0.37.0", features = ["persistence"] }
ego-tree = "0.11"
egui_extras = "0.37.0"
encoding_rs = "0.8.44"
flate2 = { version = "1.1.11", default-features = false, features = ["zlib-rs"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
jieba-rs = "0.11.0"
libloading = "0.9.1"
ltp = { version = "0.1.9", features = ["serialization", "near-char-type"] }
memmap2 = "0.9"
percent-encoding = "2.3.2"
rayon = "1.11"
regex = "1.13.1"
rfd = "0.18.0"
roxmltree = "0.21.2"
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled", "collation"] }
rustc-hash = "2.1.3"
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
sha2 = "0.11.1"
# Reader read-aloud: Azure's MP3 audio.
symphonia = { version = "0.6.1", default-features = false, features = ["mp3"] }
# Reader read-aloud, local voice (src/reader/tts/local.rs): its clips are
# saved as Ogg Opus (libopus, built from source with CMake).
ogg = "0.9.2"
opus = "0.4.0"
tar = { version = "0.4.46", default-features = false }
tempfile = "3.27.0"
unicode-general-category = "1.1.0"
unicode-normalization = "0.1.26"
unicode-script = "0.5.9"
unicode-segmentation = "1.13.3"
ureq = "3.5.2"
# Dictionary glossaries (src/dict); already built for include-flate. zstd-sys
# for training the glossaries' dictionary on all cores.
zstd = "0.14.4"
zstd-sys = { version = "2.1.3", features = ["experimental", "zstdmt"] }
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# child_guard.rs: llama.cpp dies with hanstat; src/dict: free disk space;
# src/reader/tts: the Azure key, encrypted for the user (DPAPI).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.191"
# src/reader/tts: the Azure key in the Secret Service keyring (zbus is
# already here through eframe's accessibility; this adds its blocking API).
zbus = { version = "5.19.0", default-features = false, features = ["async-io", "blocking-api"] }

# src/reader/tts: the Azure key in the Keychain.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"

[build-dependencies]
winresource = "0.1.34"

[profile.release]
lto = "thin"
codegen-units = 4

# The perceptron decoder is unusably slow unoptimised; keep deps fast in dev builds.
[profile.dev.package."*"]
opt-level = 3
